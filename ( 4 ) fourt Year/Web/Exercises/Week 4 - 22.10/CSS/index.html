<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        h1,
        p {
            color: #1f4e79;
            font-size: 5em;
        }

        * {
            box-sizing: border-box;
        }

        p {
            line-height: 3px;
        }

        .text {
            color: green;
        }
    </style>

</head>

<body>

    <p>Hello world</p>
    <p class="text">Червен параграф</p>
    <p style="color:red;">Червен параграф</p>
</body>

</html>
